name: expense_tracker
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  meta: ^1.16.0

  google_sign_in: ^6.2.1
  firebase_auth: ^4.19.0
  firebase_core: ^2.30.0

  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.3
  path: ^1.9.0
  saropa_drift_advisor: ^4.1.19

  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  get_it: ^7.7.0

  dartz: ^0.10.1

  go_router: ^14.8.0

  intl: ^0.20.2
  shimmer: ^3.0.0

  permission_handler: ^12.0.1
  flutter_sms_inbox: ^1.0.4
  flutter_local_notifications: ^17.2.2
  workmanager: ^0.9.0
  shared_preferences: ^2.5.5
  http: ^1.2.1

  fl_chart: ^0.68.0

  talker: ^4.6.6

  flutter_launcher_icons: ^0.14.4
  dio: ^5.9.2
  flutter_secure_storage: ^10.0.0
  flutter_dotenv: ^6.0.1
  connectivity_plus: ^7.1.1
  uuid: ^4.5.3
  picons: ^3.0.1
  flutter_markdown: ^0.7.7+1
  camera: ^0.12.0+2
  image_picker: ^1.2.3
  url_launcher: ^6.3.3
  slang: ^4.19.2
  slang_flutter: ^4.19.0
  flutter_localizations:
    sdk: flutter
  share_plus: ^10.0.0
  csv: ^8.0.0
  archive: ^3.6.1
  in_app_review: ^2.0.12
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  mocktail: ^1.0.4

  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  dart_code_linter: ^2.0.0
  excel: ^4.0.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/onboarding/
    - .env.dev
    - .env.prod

  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
    # Bangla fallback for Lato (AppTypography.fontFamilyFallback).
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700

dependency_overrides:
  shared_preferences_android: 2.4.23
