name: Nightly mobile

# The slow checks the PR workflow (ci.yml) leaves out: end-to-end tests on an
# emulator, frame timings, a monkey run, cold start, app size and mutation
# testing. Emulator timings only warn (QA plan Q6); size, crashes and
# mutation score fail.
on:
  schedule:
    - cron: '0 20 * * *' # 02:00 in Dhaka
  workflow_dispatch:

env:
  API_LEVEL: 34
  # The emulator the runner starts; every adb and Flutter command targets it.
  DEVICE: emulator-5554
  EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
  # A release build signed with a throwaway key: these APKs are never
  # distributed.
  KEY_ALIAS: upload
  KEY_PASSWORD: nightly-only
  KEY_STORE_PASSWORD: nightly-only

defaults:
  run:
    working-directory: packages/mobile

jobs:
  e2e:
    name: Patrol end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - &env-files
        name: Prepare env files
        run: |
          cp .env.dev.example .env.dev
          cp .env.prod.example .env.prod
          # Release builds need an HTTPS server address to start; nothing
          # here talks to it.
          sed -i 's#^BACKEND_URL=.*#BACKEND_URL=https://nightly.invalid/api#' .env.prod
      - &flutter-version
        name: Read the Flutter version
        run: echo "FLUTTER_VERSION=$(jq -r .flutter .fvmrc)" >> "$GITHUB_ENV"
      - &java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - &flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - &kvm
        name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - &avd-cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}
      - &avd-snapshot
        name: Create the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "Snapshot created"
      - run: flutter pub get
      - run: dart pub global activate patrol_cli
      - name: Run the end-to-end tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          working-directory: packages/mobile
          script: |
            integration_test/support/seed_sms.sh "$DEVICE"
            patrol test -d "$DEVICE" --target integration_test

  perf:
    name: Frame timings
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - *env-files
      - *flutter-version
      - *java
      - *flutter
      - *kvm
      - *avd-cache
      - *avd-snapshot
      - run: flutter pub get
      - name: Trace the scenarios
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          working-directory: packages/mobile
          script: flutter drive --profile --no-dds -d "$DEVICE" --driver test_driver/perf_driver.dart --target perf_test/app_perf_test.dart
      - name: Compare with the baseline
        run: dart scripts/perf_compare.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-timelines
          path: packages/mobile/build/*.timeline*.json

  device-checks:
    name: Monkey run and cold start
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - *env-files
      - *flutter-version
      - *java
      - *flutter
      - *kvm
      - *avd-cache
      - *avd-snapshot
      - &throwaway-key
        name: Make a throwaway signing key
        run: keytool -genkeypair -keystore android/app/release.jks -storepass "$KEY_STORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 1 -dname CN=Nightly
      - run: flutter build apk --release --target-platform android-x64
      - name: Monkey run and cold start
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          working-directory: packages/mobile
          script: |
            adb -s "$DEVICE" install -r build/app/outputs/flutter-apk/app-release.apk
            scripts/cold_start.sh "$DEVICE"
            scripts/monkey.sh "$DEVICE" 10000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monkey-logs
          path: |
            packages/mobile/build/monkey.txt
            packages/mobile/build/monkey-logcat.txt

  size:
    name: App size
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - *env-files
      - *flutter-version
      - *java
      - *flutter
      - *throwaway-key
      - run: flutter build appbundle --analyze-size --target-platform android-arm64
      - run: scripts/size_diff.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: size-analysis
          path: ~/.flutter-devtools/*.json

  deep-tests:
    name: Mutation, property and leak tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - *env-files
      - *flutter-version
      - *flutter
      - run: flutter pub get
      - name: Property tests at 2000 examples
        run: flutter test test/property --dart-define=PROPERTY_TRIALS=2000
      # Coverage lets mutation testing skip lines no test reaches.
      - name: Whole suite with leak tracking
        run: flutter test --coverage --dart-define=LEAK_TRACKING=true
      - name: Mutation testing
        run: dart run mutation_test mutation/*.xml -c coverage/lcov.info -o build/mutation -f html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: packages/mobile/build/mutation
