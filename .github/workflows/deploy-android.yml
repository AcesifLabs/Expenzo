name: Deploy Android

on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Play Store
    runs-on: ubuntu-latest
    environment: mobile-internal

    env:

      HAS_SENTRY: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}

    defaults:
      run:
        working-directory: packages/mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse release tag
        id: version
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^mobile-v([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            echo "Invalid tag: $TAG"
            echo "Expected format: mobile-v1.2.3+45"
            exit 1
          fi

          echo "build_name=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

      - name: Verify tag commit is on main
        run: |
          set -euo pipefail
          git fetch origin main
          TAG_COMMIT="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Tag commit $TAG_COMMIT is not reachable from origin/main"
            exit 1
          fi

      - name: Read the Flutter version
        run: echo "FLUTTER_VERSION=$(jq -r .flutter .fvmrc)" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: packages/mobile/android

      - name: Prepare CI env files
        run: |
          cp .env.dev.example .env.dev
          cp .env.prod.example .env.prod

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Decode .env.prod
        run: echo "${{ secrets.ENV_PROD }}" | base64 --decode > .env.prod

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 --decode > android/app/google-services.json

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks

      - name: Run Fastlane beta lane
        working-directory: packages/mobile/android
        run: bundle exec fastlane beta
        env:
          BUILD_NAME: ${{ steps.version.outputs.build_name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}

      - name: Upload Dart symbols to Sentry
        if: env.HAS_SENTRY == 'true'
        run: |
          set -euo pipefail

          APP_ID="$(sed -n 's/.*applicationId = "\(.*\)".*/\1/p' android/app/build.gradle.kts)"
          SENTRY_RELEASE="$APP_ID@$BUILD_NAME+$BUILD_NUMBER" dart run sentry_dart_plugin
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          BUILD_NAME: ${{ steps.version.outputs.build_name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          SENTRY_DIST: ${{ steps.version.outputs.build_number }}

      - name: Upload release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: expenzo-android-${{ github.ref_name }}
          path: packages/mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload symbols and R8 mapping artifact
        uses: actions/upload-artifact@v4
        with:
          name: expenzo-android-symbols-${{ github.ref_name }}
          path: |
            packages/mobile/build/symbols
            packages/mobile/build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: error
