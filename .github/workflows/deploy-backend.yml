name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'packages/backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euo pipefail

            echo "=== Pulling latest code ==="
            cd /root/Expenzo
            git pull origin main

            echo "=== Writing .env file ==="
            echo "${{ secrets.BACKEND_ENV_BASE64 }}" | base64 --decode > packages/backend/.env

            echo "=== Building ==="
            cd packages/backend
            docker compose build

            # Migrations run from the freshly built image so new migration
            # files are included before the new code starts.
            echo "=== Running migrations ==="
            docker compose run --rm api npm run migration:run:prod

            echo "=== Restarting ==="
            docker compose up -d --force-recreate

            echo "=== Waiting for health check ==="
            for i in $(seq 1 60); do
              if wget --spider -q http://localhost:3000/api/health 2>/dev/null; then
                echo "Health check passed after ${i}s"
                docker compose logs --tail=20
                exit 0
              fi
              sleep 1
            done

            echo "ERROR: Health check failed after 60s"
            docker compose logs --tail=50
            exit 1
