name: Backend CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/backend/**'
      - '.github/workflows/ci-backend.yml'
  push:
    branches: [develop]
    paths:
      - 'packages/backend/**'

jobs:
  ci:
    name: Type Check, Lint, Test & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: E2E tests
        run: npm run test:e2e
        env:
          JWT_SECRET: test-jwt-secret
          JWT_EXPIRES_IN: 1d
          PORT: 3000
