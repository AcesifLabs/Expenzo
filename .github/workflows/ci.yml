name: Flutter CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/mobile/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [develop]
    paths:
      - 'packages/mobile/**'
      - '.github/workflows/ci.yml'

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare CI env files
        run: |
          cp .env.dev.example .env.dev
          cp .env.prod.example .env.prod

      - name: Read the Flutter version
        run: echo "FLUTTER_VERSION=$(jq -r .flutter .fvmrc)" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run DCL metrics
        run: dart run dart_code_linter:metrics analyze lib

      - name: Check unused code
        run: dart run dart_code_linter:metrics check-unused-code lib

      - name: Check unnecessary nullable parameters
        run: dart run dart_code_linter:metrics check-unnecessary-nullable lib

      - name: Check translations
        run: bash scripts/check_i18n.sh


      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Coverage gate
        run: bash scripts/coverage_gate.sh


      - name: Run widget tests with leak tracking
        run: flutter test --dart-define=LEAK_TRACKING=true test/features test/shared test/a11y
